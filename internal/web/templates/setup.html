<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Set up · LabDoc</title>
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-body">
  <main class="auth-main">
    <div class="card form-card auth-card">
      <div class="brand auth-brand">{{template "i-logo"}}LabDoc</div>
      <div class="page-head"><h2>Create the operator account</h2></div>
      <p>First run: create the account used to sign in to LabDoc. You can add more accounts later from Account settings.</p>
      {{if .Error}}<p role="alert"><mark>{{.Error}}</mark></p>{{end}}
      <form method="post" action="/setup">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label>Username
          <input type="text" name="username" value="{{.Username}}" autocomplete="username" required autofocus>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="new-password" required minlength="10">
        </label>
        <label>Confirm password
          <input type="password" name="confirm" autocomplete="new-password" required minlength="10">
        </label>
        <div class="form-actions">
          <button type="submit" class="btn-icon">{{template "i-check"}}Create account</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
