{{define "head"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · LabDoc</title>
  <script>
    // Apply a saved theme before first paint to avoid a light flash. With no
    // saved choice, Pico follows the OS setting (prefers-color-scheme).
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/pico.min.css">
  <style>
    /* Highlighted badges, e.g. drive types. Fixed colors keep them readable in both themes. */
    .tag { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .78rem;
           font-weight: 600; color: #fff; background: #475569; }
    .tag-ssd { background: #1d4ed8; }
    .tag-hdd { background: #b45309; }
    .tag-nvme { background: #0f766e; }
    .tag-trunk { background: #7c3aed; }
    .tag-access { background: #15803d; }
    #theme-toggle { margin: 0; padding: .25rem .75rem; }
    :root:not([data-theme]) #theme-toggle .to-light { display: none; }
    [data-theme="dark"] #theme-toggle .to-dark, [data-theme="light"] #theme-toggle .to-light { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) #theme-toggle .to-dark { display: none; }
      :root:not([data-theme]) #theme-toggle .to-light { display: inline; }
    }
  </style>
  <script src="/static/htmx.min.js" defer></script>
  <script>
    // Delegated so it keeps working after hx-boost swaps the body.
    document.addEventListener("click", function (ev) {
      if (!ev.target.closest("#theme-toggle")) return;
      var root = document.documentElement;
      var cur = root.getAttribute("data-theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var next = cur === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  </script>
</head>
<body hx-boost="true">
  <header>
    <nav>
      <ul><li><strong><a href="/">LabDoc</a></strong></li></ul>
      <ul>
        {{range .Nav}}<li><a href="/{{.Key}}">{{.Plural}}</a></li>{{end}}
        <li><a href="/topologies">Topology</a></li>
        <li>
          <button type="button" id="theme-toggle" class="secondary outline" aria-label="Toggle dark mode">
            <span class="to-dark">🌙 Dark</span><span class="to-light">☀️ Light</span>
          </button>
        </li>
      </ul>
    </nav>
  </header>
  <main>
{{end}}
{{define "foot"}}
  </main>
  <footer><small>LabDoc v{{version}}</small></footer>
</body>
</html>
{{end}}
