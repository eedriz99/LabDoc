<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset password · LabDoc</title>
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-body">
  <main class="auth-main">
    <div class="card form-card auth-card">
      <div class="brand auth-brand">{{template "i-logo"}}LabDoc</div>
      <div class="page-head"><h2>Reset your password</h2></div>
      {{if .Notice}}
      <p role="status"><ins>{{.Notice}}</ins></p>
      <p class="auth-foot"><a href="/login">Back to login</a></p>
      {{else}}
      <p>If your account has a verified email on file, we'll send a link to reset your password.</p>
      {{if .Error}}<p role="alert"><mark>{{.Error}}</mark></p>{{end}}
      <form method="post" action="/forgot-password">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label>Email
          <input type="email" name="email" value="{{.Username}}" autocomplete="email" required autofocus>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn-icon">{{template "i-check"}}Send reset link</button>
        </div>
      </form>
      <p class="auth-foot"><a href="/login">Back to login</a></p>
      {{end}}
    </div>
  </main>
</body>
</html>
