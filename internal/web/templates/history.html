{{template "head" .}}
<a class="back" href="/{{.Entity.Key}}">{{template "i-back"}}{{.Entity.Plural}}</a>
<div class="page-head"><h2>History: {{.Entity.Singular}} #{{.ID}}</h2></div>
{{range .Items}}
  <article>
    <header><strong>{{.Note}}</strong> · <small>{{.At}} UTC</small></header>
    <ul>{{range .Changes}}<li>{{.}}</li>{{end}}</ul>
  </article>
{{else}}
  <p>No history recorded.</p>
{{end}}
{{template "foot" .}}
