name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0" # release builds are CGO-free; test the same way
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -v ./...
      - name: Build
        run: go build -o /dev/null ./cmd/labdoc
