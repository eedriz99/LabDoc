<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Choose a new password · LabDoc</title>
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-body">
  <main class="auth-main">
    <div class="card form-card auth-card">
      <div class="brand auth-brand">{{template "i-logo"}}LabDoc</div>
      <div class="page-head"><h2>Choose a new password</h2></div>
      {{if .Error}}<p role="alert"><mark>{{.Error}}</mark></p>{{end}}
      <form method="post" action="/reset-password/{{.Token}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label>New password
          <input type="password" name="password" autocomplete="new-password" required minlength="10" autofocus>
        </label>
        <label>Confirm new password
          <input type="password" name="confirm" autocomplete="new-password" required minlength="10">
        </label>
        <div class="form-actions">
          <button type="submit" class="btn-icon">{{template "i-check"}}Set new password</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
